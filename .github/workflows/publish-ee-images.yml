name: Publish EE Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/publish-ee-images.yml"
      - "packaging/docker/Dockerfile.den"
      - "packaging/docker/Dockerfile.den-web"
      - "packaging/docker/Dockerfile.inference"
      - "packaging/helm/openwork-ee/**"
      - "ee/apps/den-api/**"
      - "ee/apps/den-web/**"
      - "ee/apps/inference/**"
      - "ee/packages/**"
      - "packages/email/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  helm-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint packaging/helm/openwork-ee

      - name: Render chart
        run: helm template openwork-ee packaging/helm/openwork-ee --set ingress.enabled=true --set inference.enabled=true

  ee-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openwork-den-api
            dockerfile: packaging/docker/Dockerfile.den
            port: 8788
            health_path: /health
            smoke_env: >-
              -e DB_MODE=mysql
              -e DATABASE_URL=mysql://smoke:smoke@127.0.0.1:3306/smoke
              -e DEN_DB_ENCRYPTION_KEY=ci-den-db-encryption-key-value-123456
              -e BETTER_AUTH_SECRET=ci-better-auth-secret-value-123456
              -e BETTER_AUTH_URL=http://127.0.0.1:8788
          - image: openwork-den-web
            dockerfile: packaging/docker/Dockerfile.den-web
            port: 3005
            health_path: /api/health
            smoke_env: ""
          - image: openwork-inference
            dockerfile: packaging/docker/Dockerfile.inference
            port: 8791
            health_path: /health
            smoke_env: >-
              -e DB_MODE=mysql
              -e DATABASE_URL=mysql://smoke:smoke@127.0.0.1:3306/smoke
              -e DEN_DB_ENCRYPTION_KEY=ci-den-db-encryption-key-value-123456

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push == true }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke health endpoint
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          container_id="$(docker run -d --rm -P ${{ matrix.smoke_env }} "$image_tag")"
          cleanup() {
            docker stop "$container_id" >/dev/null || true
          }
          trap cleanup EXIT

          host_port=""
          for attempt in {1..10}; do
            host_port="$(docker port "$container_id" "${{ matrix.port }}/tcp" 2>/dev/null | awk -F: 'NR == 1 { print $NF }')"
            if [ -n "$host_port" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$host_port" ]; then
            docker logs "$container_id" || true
            exit 1
          fi

          url="http://127.0.0.1:${host_port}${{ matrix.health_path }}"

          for attempt in {1..30}; do
            if node -e "fetch(process.argv[1]).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))" "$url"; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id" || true
          exit 1
