# TEMPORARY — deleted before merge. Proves the diff-warden app token can
# create and delete v* tags through the ruleset, and that the duplicate
# Release App run triggered by the app's tag push is skipped by the actor
# guard (the smoke tag points at this branch's HEAD, so the triggered run
# evaluates the guarded workflow).
name: Release Tag Push Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/release-tag-app-token

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    # WARDEN_PRIVATE_KEY is environment-scoped; the smoke branch is
    # temporarily allowed on the environment's deployment policy.
    environment: warden-clearance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mint tag-push token
        id: tag-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.WARDEN_APP_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}

      - name: Create and delete a v* smoke tag through the ruleset
        shell: bash
        env:
          GH_TOKEN: ${{ steps.tag-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="v0.0.0-tagsmoke-${GITHUB_RUN_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          echo "Created ${TAG} through the v* ruleset as diff-warden (REST)."
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          echo "Deleted ${TAG} through the v* ruleset as diff-warden (REST)."
