# Runs every slow eval spec in three balanced Daytona batches. Each batch keeps
# one prewarmed Den + desktop pair and reuses it across its assigned specs.
# The checked-in lane profile removes legitimate skips before the matrix is built.
# The mega spec is excluded because the Nightly Mega Eval workflow owns it.
# Specs that drive raw desktop() from @openwork/hosts are excluded dynamically:
# they spawn Electron on the caller's machine (correct inside a VNC sandbox or
# on a dev workstation, impossible on a headless runner) and need a follow-up
# in-sandbox vitest lane. The plan job lists every exclusion in its summary.
name: Slow Specs Sweep

on:
  workflow_run:
    workflows: [Warden]
    types: [completed]
  workflow_dispatch:
    inputs:
      only:
        description: "Substring filter on spec filenames; empty runs all"
        required: false
        default: ""
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: slow-specs-sweep
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'different-ai/openwork' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      batches: ${{ steps.matrix.outputs.batches }}
      has_specs: ${{ steps.matrix.outputs.has_specs }}

    steps:
      - name: Authorize Warden-cleared pull request
        id: authorize
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/warden-summary
          gh run download "$RUN_ID" --repo "$REPO" --name warden-summary --dir /tmp/warden-summary
          summary_sha="$(jq -r '.head_sha' /tmp/warden-summary/warden-summary.json)"
          blocking="$(jq -r '.blocking_count // .findings_count' /tmp/warden-summary/warden-summary.json)"
          current_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"

          if [ "$summary_sha" != "$HEAD_SHA" ] || [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::error::Warden summary or pull request head does not match $HEAD_SHA."
            exit 1
          fi
          if [ "$blocking" != "0" ]; then
            echo "::notice::Slow proof withheld: Warden reported $blocking blocking finding(s)."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          guarded="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | grep -E '^(\.github/|warden\.toml$|\.warden/|\.agents/skills/|\.claude/skills/)' || true)"
          if [ -n "$guarded" ]; then
            echo "::notice::Slow proof withheld: PR changes trusted review machinery."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Authorize manual sweep
        id: authorize-manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Check slow specs sweep configuration
        id: config
        if: steps.authorize.outputs.authorized == 'true' || steps.authorize-manual.outputs.authorized == 'true'
        shell: bash
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          missing=""
          [ -z "${DAYTONA_API_KEY:-}" ] && missing="$missing DAYTONA_API_KEY"
          [ -z "${OPENAI_API_KEY:-}" ] && missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping slow specs sweep; missing GitHub configuration:$missing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Build spec matrix
        id: matrix
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          ONLY_FILTER: ${{ inputs.only }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Raw desktop() specs spawn Electron on the vitest host itself; on a
          # headless runner that dies before CDP. Exclude them until the
          # in-sandbox vitest lane exists, and surface the list in the summary.
          raw_desktop="$(
             grep -l '"@openwork/hosts"' evals/specs/*.slow.test.ts 2>/dev/null \
               | xargs grep -l '\bdesktop(' 2>/dev/null \
               | sed 's#^evals/specs/##' \
               | sort \
               || true
           )"
          # The checked-in profile is the explicit contract for this lane.
          # Raw desktop() detection remains as a guard for newly-added specs
          # that have not been classified yet.
          profile='evals/specs/slow-sweep-profile.json'
          excluded="$(
            printf '%s\n' "$raw_desktop" "$(jq -r '.excluded[].spec' "$profile")" \
              | sed '/^$/d' \
              | sort -u
          )"
          excluded_json="$(printf '%s\n' "$excluded" | jq -Rsc 'split("\n") | map(select(length > 0))')"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            matched_specs="$(node evals/scripts/spec-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --matched-specs)"
            only_filter=""
          else
            matched_specs='[]'
            only_filter="$ONLY_FILTER"
          fi

          specs="$(
            printf '%s\n' evals/specs/*.slow.test.ts \
              | sed 's#^evals/specs/##' \
              | jq -Rsc --arg only "$only_filter" --argjson matched "$matched_specs" --argjson excluded "$excluded_json" '
                  split("\n")
                  | map(select(length > 0))
                  | map(select(. != "org-team-lifecycle-mega.slow.test.ts"))
                  | map(select(. as $s | $excluded | index($s) | not))
                  | map(select(($matched | length == 0) or (($matched | index($s)) != null)))
                  | map(select($only == "" or contains($only)))
                '
          )"
          batches="$(
            echo "$specs" | jq -c '
              . as $specs
              | [
                  range(0; 3) as $index
                  | {
                      name: "batch-\($index + 1)",
                      specs: [
                        $specs
                        | to_entries[]
                        | select((.key % 3) == $index)
                        | .value
                      ]
                    }
                ]
              | map(select(.specs | length > 0))
            '
          )"

          {
            echo "### Sweep plan"
            echo
            echo "Matrix specs: $(echo "$specs" | jq 'length') across $(echo "$batches" | jq 'length') batches"
            if [ "$EVENT_NAME" = "workflow_run" ] && [ "$(echo "$specs" | jq 'length')" -eq 0 ]; then
              echo "Warden suggestion: add or update an evals/specs/<feature>.slow.test.ts proof for this PR."
            fi
            echo "$batches" | jq -r '.[] | "- `\(.name)`: \(.specs | length) specs"'
            echo
            echo "Excluded (profile-incompatible or raw desktop()): $(echo "$excluded_json" | jq 'length')"
            echo "$excluded_json" | jq -r --slurpfile profile "$profile" '
              .[] as $spec
              | (($profile[0].excluded | map(select(.spec == $spec)) | first | .reason) // "raw desktop() topology") as $reason
              | "- `\($spec)`: \($reason)"
            '
          } >> "$GITHUB_STEP_SUMMARY"

           echo "batches=$batches" >> "$GITHUB_OUTPUT"
           if [ "$(echo "$specs" | jq 'length')" -gt 0 ]; then
             echo "has_specs=true" >> "$GITHUB_OUTPUT"
           else
             echo "has_specs=false" >> "$GITHUB_OUTPUT"
           fi
           echo "Batch matrix: $batches"

  spec:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.has_specs == 'true'
    name: spec (${{ matrix.batch.name }})
    # This environment requires maintainer approval before PR-controlled code
    # can execute or access repository secrets.
    environment: pr-slow-specs
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # The eval harness shells out to the daytona CLI (testkit daytonaAvailable
      # gate and @openwork/hosts exec). The binary is pinned to a release tag
      # and checksum-verified before it can run with CI secrets. When bumping,
      # take the digest from GitHub's authoritative asset metadata, never from
      # a local download (a truncating proxy once poisoned the pin):
      #   gh api repos/daytona/clients/releases/tags/<tag> --jq '.assets[] | select(.name == "daytona-linux-amd64") | .digest'
      - name: Install Daytona CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_CLI_TAG: v0.204.0
          DAYTONA_CLI_SHA256: 76701138c2ce93c14b30e7b10f51aa5ea2a9e156777bab933a4272237d81f14d
        run: |
          set -euo pipefail
          gh release download "$DAYTONA_CLI_TAG" --repo daytona/clients --pattern daytona-linux-amd64 --output /tmp/daytona --clobber
          echo "$DAYTONA_CLI_SHA256  /tmp/daytona" | sha256sum -c -
          sudo install -m 0755 /tmp/daytona /usr/local/bin/daytona
          daytona --version
          # The CLI requires a stored profile; the env var alone is not enough.
          daytona login --api-key "$DAYTONA_API_KEY"

      - name: Run batch
        id: run
        shell: bash
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NO_COLOR: "1"
          BATCH_NAME: ${{ matrix.batch.name }}
          SPECS_JSON: ${{ toJSON(matrix.batch.specs) }}
        run: |
          set -euo pipefail

          mapfile -t specs < <(jq -r '.[] | "specs/" + .' <<< "$SPECS_JSON")
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No specs were assigned to $BATCH_NAME." >&2
            exit 1
          fi

          set +e
          OPENWORK_EVAL_DAYTONA=1 OPENWORK_EVAL_APP_SPECS=1 \
          OPENWORK_EVAL_MAX_WORKERS=1 \
          OPENWORK_EVAL_AUTOMATIONS_SPEC=1 OPENWORK_EVAL_CONNECTOR_SPEC=1 \
          OPENWORK_EVAL_LOCAL_MANAGED_MCP=1 OPENWORK_EVAL_GENERATED_ARTIFACT_VIEWS_SPEC=1 \
          OPENWORK_EVAL_SAVED_SCRIPT_AUTOMATIONS_SPEC=1 OPENWORK_EVAL_ENGINE_ROLLOVER_SPEC=1 \
          OPENWORK_EVAL_MODEL=big-pickle OPENWORK_EVAL_VISION=defer \
          pnpm --dir evals exec vitest run --config vitest.config.ts --project stack "${specs[@]}" \
            2>&1 | tee /tmp/spec-run.log
          vitest_status="${PIPESTATUS[0]}"
          set -e

          sed -E 's/\x1B\[[0-9;]*m//g' /tmp/spec-run.log > /tmp/spec-run-plain.log
          detail="${#specs[@]} specs"
          if [ "$vitest_status" -ne 0 ]; then
            result="failed"
          elif grep -Eq "Tests[[:space:]].*skipped" /tmp/spec-run-plain.log; then
            result="skipped"
            needs_reasons="$(grep -o '\[needs:[^]]*\]' /tmp/spec-run-plain.log | sort -u | paste -sd ';' - || true)"
            if [ -n "$needs_reasons" ]; then
              detail="$detail; $needs_reasons"
            fi
          else
            result="passed"
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "### $BATCH_NAME"
            echo
            echo "| Batch | Result | Detail |"
            echo "| --- | --- | --- |"
            echo "| $BATCH_NAME | $result | $detail |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Vitest exit code: $vitest_status"

          if [ "$result" = "failed" ]; then
            exit 1
          fi

      - name: Judge deferred vision claims
        if: steps.run.outputs.result != 'failed'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' roll; do
            pnpm --dir evals fraimz:judge -- --roll "$roll"
          done < <(find "$GITHUB_WORKSPACE/evals/results/rolls" -mindepth 1 -maxdepth 1 -type d -print0)

      - name: Upload spec roll
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sweep-roll-${{ strategy.job-index }}
          path: evals/results/rolls/
          retention-days: 14
          if-no-files-found: ignore

  verdict:
    needs:
      - plan
      - spec
    if: always() && needs.plan.outputs.enabled == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Report sweep verdict
        shell: bash
        env:
          SPEC_RESULT: ${{ needs.spec.result }}
        run: |
          set -euo pipefail

          {
            echo "## Slow Specs Sweep"
            echo
            echo "Spec matrix result: **$SPEC_RESULT**."
            echo "A successful matrix means no spec failed; any skipped specs make the sweep Incomplete, not Passed."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SPEC_RESULT" = "failure" ]; then
            exit 1
          fi
